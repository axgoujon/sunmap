<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sunmap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="map"></div>
<canvas id="overlay" hidden></canvas>

<div class="card controls">
  <h1>Sunmap</h1>
  <div class="segmented" role="radiogroup" aria-label="Layer">
    <button data-mode="binary" class="active" role="radio" aria-checked="true">Shade</button>
    <button data-mode="power" role="radio">Power</button>
    <button data-mode="energy" role="radio">Energy</button>
    <button data-mode="sunHours" role="radio">Hours</button>
    <button data-mode="slope" role="radio">Slope</button>
  </div>
  <div class="legend">
    <div id="legendBar" class="legend-bar"></div>
    <div class="legend-labels"><span id="legendMin"></span><span id="legendMax"></span></div>
  </div>
  <label class="slider-row">
    <span>Opacity</span>
    <input type="range" id="opacity" min="0" max="100" value="75">
  </label>
  <p class="fine">Clear-sky model, not an avalanche forecast. Check your local bulletin.</p>
</div>

<div class="card zoom-hint" id="zoomHint" hidden>
  <p>Zoomed out, so nothing is computed while you browse. Zoom in, or compute this view now.</p>
  <div class="actions">
    <button id="zoomIn" class="primary">Zoom in</button>
    <button id="computeAnyway">Compute anyway</button>
  </div>
</div>

<div class="card inspector" id="inspector" hidden>
  <div class="inspector-head">
    <span id="pointTitle">Point</span>
    <button id="closeInspector" class="icon" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <dl id="pointStats" class="stats"></dl>
  <figure>
    <canvas id="curve"></canvas>
    <figcaption>Irradiance through the day, W/m² · <span class="key sun"></span>direct sun <span class="key sky"></span>sky light</figcaption>
  </figure>
  <figure>
    <canvas id="horizonPlot"></canvas>
    <figcaption>Horizon and sun path by bearing · dashed: solstices</figcaption>
  </figure>
</div>

<div class="card timebar">
  <input type="date" id="date" aria-label="Date">
  <button id="now">Now</button>
  <input type="range" id="time" min="0" max="1439" step="5" value="660" aria-label="Time of day">
  <div class="clock">
    <output id="timeLabel">11:00</output>
    <span id="sunInfo"></span>
  </div>
</div>

<div id="status" class="status"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
